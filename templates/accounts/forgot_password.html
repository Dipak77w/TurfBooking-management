{% extends 'base.html' %}

{% block title %}Reset Password | MiniTurf Arena{% endblock %}

{% block content %}
<div class="py-5" style="background-color: #F5F8F6;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 p-md-5 border shadow-sm bg-white" style="border-radius: 16px;">
                    <div class="text-center mb-4">
                        <div class="mx-auto mb-2 d-flex align-items-center justify-content-center rounded-circle" style="width: 58px; height: 58px; background-color: #fef3c7; color: #b45309;">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-navy">Reset Password</h3>
                        <p class="text-muted small">Enter your registered email and choose a new password.</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Registered Account Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                            <i class="bi bi-arrow-repeat me-1"></i> Update Password
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <a href="{% url 'customer_login' %}" class="small text-muted">&larr; Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
